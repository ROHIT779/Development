services:
  voting-creator:
    build:
      context: .
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16
    container_name: creator_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tata
      POSTGRES_DB: testdb
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d/
volumes:
  postgres_data:

